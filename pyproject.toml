[project]
name = "DynamicAdaptor"
version = "0.6.1"
description = "将B站动态数据转换为渲染所需的统一数据类型"
authors = [
    {name = "DMC", email = "lzxder@outlook.com"},
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "loguru>=0.6.0,<1.0.0",
]
requires-python = "<4.0.0,>=3.8.0"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0"
]

